<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CARTIFY — All Products</title><style>
    :root{
      --ink:#171613; --paper:#f5efe5; --cream:#eee4d6; --clay:#b88a54;
      --green:#59683a; --green-dark:#4d5b31; --muted:#746f66; --line:rgba(23,22,19,.13); --white:#fffdf8;
      --serif:"Playfair Display", Georgia, serif; --sans:"DM Sans", Arial, sans-serif;
      --radius:22px; --shadow:0 20px 60px rgba(23,22,19,.10);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.5}
    a{color:inherit;text-decoration:none}
    button,input,select{font:inherit}
    button{cursor:pointer}
    img{max-width:100%;display:block}
    .announcement{background:var(--ink);color:var(--paper);text-align:center;padding:9px 18px;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
    header{position:sticky;top:0;z-index:20;background:rgba(244,240,232,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
    .nav{max-width:1440px;margin:auto;height:86px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;gap:24px}
    .brand{font-family:var(--sans);font-size:27px;font-weight:700;letter-spacing:.06em}
    .navlinks{display:flex;gap:34px;font-size:14px}
    .navlinks a{position:relative}
    .navlinks a:after{content:"";position:absolute;left:0;bottom:-6px;width:0;height:1px;background:var(--green);transition:.25s}
    .navlinks a:hover:after,.navlinks a.active:after{width:100%}
    .navactions{display:flex;align-items:center;gap:9px}
    .iconbtn{border:0;background:transparent;border-radius:50%;width:42px;height:42px;display:grid;place-items:center;font-size:24px}
    .cartbtn{border-radius:999px;padding:10px 15px;border:1px solid var(--green);background:var(--green);color:var(--paper)}
    .cartcount{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:50%;background:#6b744b;font-size:11px;margin-left:5px}
    .hero{max-width:1440px;margin:auto;padding:58px 28px 38px;display:grid;grid-template-columns:.88fr 1.12fr;gap:42px;align-items:center}
    .eyebrow{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--green);font-weight:700}
    h1,h2,h3,p{margin-top:0}
    h1{font-family:var(--serif);font-size:clamp(54px,6.8vw,92px);line-height:1.02;letter-spacing:-.055em;margin:18px 0 28px;font-weight:600}
    .hero-copy{max-width:560px;font-size:18px;line-height:1.85;color:#555048}
    .actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}
    .btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--green);padding:13px 22px;border-radius:8px;transition:.25s}
    .btn.primary{background:var(--green);color:var(--paper);border-color:var(--green)}
    .btn:hover{transform:translateY(-2px)}
    .hero-art{min-height:610px;position:relative;border-radius:28px;overflow:hidden;background:var(--paper) url("assets/cart-hero.png") center center/cover no-repeat;box-shadow:none;isolation:isolate}
    .hero-art:before,.hero-art:after{display:none;content:"";position:absolute;border-radius:50%;mix-blend-mode:multiply}
    .hero-art:before{width:360px;height:360px;background:#d7d0b9;top:10%;left:13%}
    .hero-art:after{width:300px;height:300px;background:#743d32;right:5%;bottom:6%}
    .brush{display:none}
    .hero-note{display:none}
    section{max-width:1240px;margin:auto;padding:80px 24px}
    .sectionhead{display:flex;justify-content:space-between;gap:25px;align-items:end;margin-bottom:30px}
    .sectionhead h2{font-family:var(--serif);font-size:48px;line-height:1;margin:8px 0 0;letter-spacing:-.04em}
    .sectionhead p{max-width:410px;color:var(--muted);margin:0}
    .categories{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
    .category{min-height:210px;border-radius:var(--radius);padding:22px;display:flex;flex-direction:column;justify-content:end;position:relative;overflow:hidden}
    .category:nth-child(1){background:#e6ddcc}.category:nth-child(2){background:#d5dcc5}.category:nth-child(3){background:#d8d0bf}.category:nth-child(4){background:#e1d6c4}
    .category:before{content:"";position:absolute;width:170px;height:170px;border-radius:50%;right:-35px;top:-45px;background:rgba(255,255,255,.25)}
    .category strong{font-family:var(--serif);font-size:28px;position:relative}.category span{position:relative;color:#4e493f;font-size:13px}
    .products{display:flex;gap:14px}.featured-viewport{overflow:hidden}.featured-carousel{position:relative;padding:0 34px}.featured-carousel .product{flex:0 0 calc((100% - 84px)/7);min-width:0}.carousel-arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:2;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--white);box-shadow:0 8px 24px rgba(23,22,19,.10);font-size:28px;line-height:1;color:var(--green)}.carousel-arrow.left{left:-2px}.carousel-arrow.right{right:-2px}.carousel-arrow:disabled{opacity:.3;cursor:default}.home-all-grid{display:grid;grid-template-columns:repeat(9,1fr);gap:14px}.home-all-card{background:var(--white);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;transition:.25s}.home-all-card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}.home-all-card .home-all-image{aspect-ratio:1/1.02;background:#eee3d2;overflow:hidden;display:grid;place-items:center}.home-all-card .home-all-image img{width:100%;height:100%;object-fit:cover}.home-all-card .home-all-info{padding:12px}.home-all-card b{font-family:var(--serif);font-size:16px;line-height:1.15;display:block}.home-all-card small{display:block;color:var(--muted);margin:7px 0 4px;font-size:11px}.home-all-card .home-price{font-weight:700;font-size:14px}
    .product{background:var(--white);border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);transition:.3s}
    .product:hover{transform:translateY(-5px);box-shadow:var(--shadow)}
    .product{cursor:pointer}.product .product-actions button{cursor:pointer}
    .product-img{aspect-ratio:1/0.78;position:relative;overflow:hidden;display:grid;place-items:center}
    .product-img span{font-family:var(--serif);font-size:72px;opacity:.45}
    .p1{background:#d8c6ad}.p2{background:#c7cdbb}.p3{background:#d7aaa0}.p4{background:#b9b1a6}.p5{background:#d9d2ba}.p6{background:#c9b0a1}
    .product-info{padding:12px}
    .product-info h3{font-family:var(--serif);font-size:16px;line-height:1.2;margin-bottom:4px}
    .meta{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:11px}
    .price{color:var(--ink);font-weight:700}
    .product-actions{display:flex;gap:8px;margin-top:10px}
    .smallbtn{flex:1;border:1px solid var(--line);background:transparent;border-radius:999px;padding:10px}
    .smallbtn.add{background:var(--ink);color:var(--paper);border-color:var(--ink)}
    .story{display:grid;grid-template-columns:.8fr 1.2fr;gap:40px;align-items:center}
    .story-art{min-height:460px;background:#c8bda9;border-radius:42px 12px 42px 12px;position:relative;overflow:hidden}
    .story-art:before{content:"";position:absolute;width:65%;height:70%;left:18%;top:14%;background:#a55c45;border-radius:46% 54% 38% 62%;transform:rotate(12deg)}
    .story-art:after{content:"ATELIER";position:absolute;bottom:24px;left:25px;font-family:var(--serif);font-size:42px;letter-spacing:.08em}
    .story h2{font-family:var(--serif);font-size:55px;line-height:1;letter-spacing:-.04em}
    .story p{color:var(--muted);max-width:570px}
    .quote{padding:95px 24px;text-align:center;max-width:950px}
    .quote p{font-family:var(--serif);font-size:clamp(34px,4.8vw,62px);line-height:1.08;letter-spacing:-.04em}
    .newsletter{background:var(--ink);color:var(--paper);border-radius:32px;padding:48px;display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:end}
    .newsletter h2{font-family:var(--serif);font-size:48px;line-height:1;margin:8px 0 0}
    .newsletter p{color:#b9b3a8}
    .subscribe{display:flex;gap:8px}
    .subscribe input{min-width:0;flex:1;border:1px solid #4d4a45;background:transparent;color:white;border-radius:999px;padding:13px 17px;outline:none}
    .subscribe button{border:0;background:var(--paper);color:var(--ink);border-radius:999px;padding:13px 20px}
    footer{border-top:1px solid var(--line);padding:40px 24px}
    .footerin{max-width:1240px;margin:auto;display:flex;justify-content:space-between;gap:30px;flex-wrap:wrap;color:var(--muted);font-size:13px}
    .footerbrand{font-family:var(--serif);font-size:25px;color:var(--ink)}
    .footerlinks{display:flex;gap:20px}
    .modalback{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:none;align-items:flex-end;justify-content:flex-end}
    .modalback.open{display:flex}
    .drawer{width:min(460px,100%);height:100%;background:var(--paper);padding:25px;display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(0,0,0,.18)}
    .drawerhead{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:17px}
    .drawerhead h2{font-family:var(--serif);font-size:32px;margin:0}
    .cartitems{flex:1;overflow:auto;padding:18px 0}
    .empty{color:var(--muted);text-align:center;padding:50px 20px}
    .cartitem{display:grid;grid-template-columns:70px 1fr auto;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
    .thumb{width:70px;height:70px;border-radius:12px;display:grid;place-items:center;font-family:var(--serif);font-size:27px}
    .cartitem strong{font-size:14px}.cartitem small{color:var(--muted);display:block}
    .remove{border:0;background:transparent;color:var(--muted)}
    .drawerfoot{border-top:1px solid var(--line);padding-top:17px}
    .total{display:flex;justify-content:space-between;font-weight:700;font-size:18px;margin-bottom:13px}
    .full{width:100%}
    .toast{position:fixed;left:50%;bottom:25px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--paper);padding:12px 17px;border-radius:999px;z-index:80;transition:.3s;font-size:13px}
    .toast.show{opacity:1;transform:translate(-50%,0)}

    /* Store functionality additions */
    .quantity input[type=number]::-webkit-inner-spin-button,.quantity input[type=number]::-webkit-outer-spin-button{appearance:none;-webkit-appearance:none;margin:0}
    .quantity input[type=number]{-moz-appearance:textfield;appearance:textfield}
    .qty-controls{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--white)}
    .qty-controls button{width:38px;height:38px;border:0;background:transparent;font-size:20px}
    .qty-controls input{width:44px;height:38px;border:0;background:transparent;text-align:center}
    .qty-controls button:hover{background:var(--cream)}
    .product-img img,.mini-image img,.product-main-image img{width:100%;height:100%;object-fit:cover}
    .image-wrap{display:block;width:100%;height:100%}.image-fallback{width:100%;height:100%;place-items:center;font-family:var(--serif);font-size:72px;opacity:.45}.product-img .image-wrap,.mini-image .image-wrap,.product-main-image .image-wrap{width:100%;height:100%}.product-img .image-wrap img,.mini-image .image-wrap img,.product-main-image .image-wrap img{display:block;width:100%;height:100%;object-fit:cover}.product-img .image-wrap,.mini-image .image-wrap,.product-main-image .image-wrap{display:block}
    .mini-image{overflow:hidden}
    .modal-panel{position:relative;width:min(760px,94vw);max-height:90vh;overflow:auto;background:var(--paper);border-radius:24px;padding:28px;box-shadow:var(--shadow)}
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,.48);z-index:70;display:none;align-items:center;justify-content:center;padding:20px}
    .overlay.open{display:flex}
    .overlay-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:15px;margin-bottom:18px}
    .review-list{display:grid;gap:12px;margin:15px 0 25px}.review{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--white)}.review small{color:var(--muted)}
    .review-form,.checkout-form{display:grid;gap:10px}.review-form input,.review-form textarea,.checkout-form input,.checkout-form select{padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--white)}
    .chatbox{border:1px solid var(--line);border-radius:16px;background:var(--white);padding:14px}.chat-messages{max-height:240px;overflow:auto;display:grid;gap:8px;margin-bottom:10px}.chat-msg{padding:9px 11px;border-radius:12px;background:var(--cream);font-size:13px}.chat-msg.customer{justify-self:start}.chat-msg.admin{justify-self:end;background:#dce2ce}.chat-form{display:flex;gap:8px}.chat-form input{flex:1;min-width:0}
    .payment-note{font-size:12px;color:var(--muted);padding:10px;background:var(--cream);border-radius:10px}
    .search-box{display:flex;gap:8px;margin:10px 0}.search-box input{flex:1;padding:12px;border:1px solid var(--line);border-radius:999px}
    @media(max-width:850px){
      .navlinks{display:none}.hero{grid-template-columns:1fr;padding-top:45px}.hero-art{min-height:390px}
      .categories{grid-template-columns:1fr 1fr}.featured-carousel .home-all-grid{grid-template-columns:repeat(3,1fr)}.story{grid-template-columns:1fr}
      .newsletter{grid-template-columns:1fr;padding:32px}
    }
    @media(max-width:560px){
      .nav{height:68px;padding:0 16px}.brand{font-size:23px}.iconbtn{width:38px;height:38px}
      .hero,section{padding-left:16px;padding-right:16px}.hero{padding-top:35px}
      h1{font-size:55px}.sectionhead{display:block}.sectionhead h2{font-size:40px;margin-bottom:10px}
      .categories,.products{grid-template-columns:1fr}.category{min-height:170px}
      .story h2{font-size:43px}.subscribe{display:block}.subscribe input,.subscribe button{width:100%;margin-top:7px}
      .quote{padding-top:55px;padding-bottom:55px}
    }
  
.all-page-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:28px}.all-page-head h1{font-family:var(--serif);font-size:clamp(48px,6vw,78px);line-height:.95;margin:0 0 8px}.all-page-head p{color:var(--muted);margin:0}.all-toolbar{display:flex;gap:10px;align-items:center;margin-bottom:22px;flex-wrap:wrap}.all-toolbar input,.all-toolbar select{padding:12px 14px;border:1px solid var(--line);border-radius:9px;background:var(--white);font:inherit}.all-toolbar input{flex:1;min-width:220px}.all-products-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:14px}.all-product-card{background:var(--white);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;transition:.25s}.all-product-card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}.all-product-image{aspect-ratio:1/0.78;background:#eee3d2;display:grid;place-items:center;overflow:hidden}.all-product-image img{width:100%;height:100%;object-fit:cover}.all-product-info{padding:10px}.all-product-info h3{font-family:var(--serif);font-size:15px;line-height:1.15;margin:0 0 5px}.all-product-info small{color:var(--muted)}.all-product-price{font-weight:700;font-size:14px;margin-top:6px}@media(max-width:1200px){.all-products-grid{grid-template-columns:repeat(5,1fr)}}@media(max-width:900px){.all-products-grid{grid-template-columns:repeat(4,1fr)}}@media(max-width:700px){.all-products-grid{grid-template-columns:repeat(2,1fr)}.all-page-head{align-items:start;flex-direction:column}}
</style><style id="cartify-custom-style">
body{font-size:calc(1rem * var(--custom-body-scale,1))}
.all-products-grid .all-product-card{border-radius:var(--custom-radius,16px);background:var(--custom-white,#fffdf8)}
</style>
  <script src="assets/cartify-data.js"></script>
</head><body>
<header><nav class="nav"><a class="brand" href="index.html#top">CARTIFY</a><div class="navlinks"><a href="index.html#featured-products">Shop</a><a href="all-products.html">All Products</a><a href="index.html#category-page">Categories</a><a href="index.html#about-page">About Us</a><a href="admin.html">Admin</a></div><div class="navactions"><button class="iconbtn" onclick="document.getElementById('search').focus()">⌕</button><button class="iconbtn" onclick="alert('Wishlist is available from the store.')">♡</button><button class="cartbtn" onclick="location.href='index.html#cart-page'">Cart <span class="cartcount" id="cartCount">0</span></button></div></nav></header>
<main><section class="page-section" style="display:block"><div class="all-page-head"><div><div class="eyebrow">COLLECTION</div><h1>All Products.</h1><p>Explore our complete collection.</p></div><a class="btn" href="index.html#featured-products">← Back to Shop</a></div><div class="all-toolbar"><input id="search" placeholder="Search products..."><select id="sort"><option value="newest">Newest</option><option value="low">Price: Low to High</option><option value="high">Price: High to Low</option></select></div><div class="all-products-grid" id="allProductsGrid"></div></section></main>
<script>
const KEY='cartifyProductsAdmin';const DEFAULT=[{id:1,name:'Olive Canvas',category:'Art & Prints',price:120,image:'',description:''}];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function dedupe(list){const seen=new Set(),out=[];for(let i=list.length-1;i>=0;i--){const p=list[i]||{};const k=String(p.name||'').trim().toLowerCase();if(k&&!seen.has(k)){seen.add(k);out.push(p)}else if(!k)out.push(p)}return out.reverse()}
let products=dedupe(JSON.parse(localStorage.getItem(KEY)||'null')||DEFAULT);
function visual(p){const u=String(p.image||'').trim();return u?`<img src="${esc(u)}" alt="${esc(p.name)}" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'"><span style="display:none">${esc(p.mark||'🛍️')}</span>`:`<span>${esc(p.mark||'🛍️')}</span>`}
const CATEGORY_BUTTONS_KEY='cartifyCategoryButtons';
function categoryMatch(p,cat){const c=String(cat||'').toLowerCase();const text=`${p.name||''} ${p.category||''} ${p.description||''}`.toLowerCase();if(!c)return true;const aliases={electronics:['electronics','electronic'],tech:['tech','computer','phone','watch','audio','charger'],fashion:['fashion','clothing','shoes','accessories'],home:['home','decor','living','house'],art:['art','print','canvas','painting','calligraphy'],gifts:['gift','gifts']};return (aliases[c]||[c]).some(k=>text.includes(k));}
function render(){let a=dedupe(products);const cat=new URLSearchParams(location.search).get('category')||'';if(cat)a=a.filter(p=>categoryMatch(p,cat));const q=document.getElementById('search').value.trim().toLowerCase();if(q)a=a.filter(p=>`${p.name} ${p.category} ${p.description||''}`.toLowerCase().includes(q));const so=document.getElementById('sort').value;if(so==='low')a.sort((x,y)=>Number(x.price)-Number(y.price));if(so==='high')a.sort((x,y)=>Number(y.price)-Number(x.price));document.getElementById('allProductsGrid').innerHTML=a.map(p=>`<article class="all-product-card" onclick="openProduct(${Number(p.id)})"><div class="all-product-image">${visual(p)}</div><div class="all-product-info"><h3>${esc(p.name)}</h3><small>${esc(p.category)}</small><div class="all-product-price">$${Number(p.price||0).toFixed(2)}</div></div></article>`).join('')||'<p class="muted">No products found.</p>'}
function openProduct(id){localStorage.setItem('cartifySelectedProduct',String(id));location.href='index.html#product-page'}
const catParam=new URLSearchParams(location.search).get('category'); if(catParam){document.querySelector('.all-page-head h1').textContent=catParam+' Products.';document.querySelector('.all-page-head p').textContent='Explore products in this category.';} document.querySelectorAll('.navlinks a').forEach(a=>a.addEventListener('click',()=>{document.querySelectorAll('.navlinks a').forEach(x=>x.classList.remove('active'));a.classList.add('active')})); document.querySelector('.navlinks a[href="all-products.html"]').classList.add('active'); document.getElementById('search').addEventListener('input',render);document.getElementById('sort').addEventListener('change',render);window.addEventListener('storage',e=>{if(e.key===KEY){products=dedupe(JSON.parse(e.newValue||'[]'));render()}});render();const cart=JSON.parse(localStorage.getItem('cartifyCart')||'[]');document.getElementById('cartCount').textContent=cart.reduce((s,x)=>s+Number(x.qty||0),0);
</script><script>
(function(){const c={headingScale:100,bodyScale:100,radius:22,spacing:80,accent:'#59683a',paper:'#f5efe5',ink:'#171613',white:'#fffdf8',title:'CARTIFY',...JSON.parse(localStorage.getItem('cartifyCustomization')||'{}')};const r=document.documentElement;r.style.setProperty('--green',c.accent);r.style.setProperty('--paper',c.paper);r.style.setProperty('--ink',c.ink);r.style.setProperty('--white',c.white);r.style.setProperty('--custom-heading-scale',Number(c.headingScale||100)/100);r.style.setProperty('--custom-body-scale',Number(c.bodyScale||100)/100);r.style.setProperty('--custom-radius',(c.radius||22)+'px');document.querySelectorAll('.brand,.footerbrand').forEach(x=>x.textContent=c.title||'CARTIFY');if(c.title)document.title=c.title+' — All Products';})();
</script>
</body></html>
